# dsh-verifier-Pro bundle patch: mounts the verifier-brain plugin into the
# host composition of a dsh profile. The plugin registers its verifier_* tools
# into the shared `tools` registry and one usage section into the global
# system prompt, so every session can drive LLM-as-a-Verifier through natural
# language or the AgentTeams workflow.
#
# Install: `dsh plugin --profile <name> add <this package>` (npm or a local
# path). Requires the project .venv (python -m venv .venv && .venv python -m
# pip install llm-verifier) or a system python with llm-verifier installed.
- insert:
    - id: verifier-brain
      # Node-resolvable package name — must stay in sync with package.json `name`.
      name: '@dsh-external/dsh-verifier-pro'
      config:
        # Sync tool-call bridge timeout in ms.
        bridgeTimeoutMs: 300000
        # Async verifier-task timeout in ms (long tournament scorings).
        taskTimeoutMs: 1800000
        # Default verifier model; per-call `model` args override.
        # 2026-08-22: deepseek-v4-flash 被 Open Code 上游 DFLASH 投机解码禁用
        # logprobs 返回（400），v4-pro 实测可用。DeepSeek 官方账户余额不足
        # （402），切回 opencode 组合；充值后可换回 deepseek-chat。
        verifierModel: deepseek-v4-pro
        # Explicit backend for opencode.ai (uses OPENCODE_GO_API_KEY from credentials)
        backendBaseUrl: https://opencode.ai/zen/go/v1
        # Concurrent workers inside the Python bridge.
        maxWorkers: 4
        # Register the verifier usage policy into the global system prompt.
        promptSection: true
        # Adaptive verification scaling: auto re-evaluate (K=3) when the
        # score margin falls in the noise band (0.03, escalateThreshold].
        autoEscalate: true
        escalateThreshold: 0.15
        maxEscalateK: 3
        # 分级评分（U-B1 已接通同步路径）：设置后仅升级轮使用更强模型，
        # 首评保持廉价档。留空 = 与 verifierModel 相同（不混平均）。
        # escalationModel: deepseek-v4-pro

# Client UI（Verifier panel + settings）不走 cordis insert：
# Web 端通过 package.json 的 dsh.client 声明 + exports["./client"] 自动发现，
# 这里再 insert 会把 host 主模块重复 apply 一次，导致 tool "verifier" 重复注册。
