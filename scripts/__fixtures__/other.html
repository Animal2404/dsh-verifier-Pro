<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>smoke test variant</title></head>
<body><canvas id="c" width="960" height="540"></canvas>
<script>
  let state = 'ready';
  const player = { x: 100, y: 100, grounded: true };
  function startGame() { state = 'playing'; }
  function update() { player.x += 2; if (player.x > 900) player.x = 50; }
  function draw() {
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#2e8b57';
    ctx.fillRect(0, 0, 960, 540);
    ctx.fillStyle = '#ffa500';
    ctx.fillRect(player.x, player.y, 50, 50);
  }
</script></body></html>
