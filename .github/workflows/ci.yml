name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 快 job：纯逻辑验证（无 llm-verifier / 无 harness 依赖），~1 分钟内完成
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Script syntax check
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
          for f in tests/*.test.mjs; do node --check "$f"; done
          python -m py_compile bridge/verifier_brain_bridge.py bridge/bridge_fix.py

      - name: Compile harness-free TS modules standalone
        run: |
          # lib/ 不入库，CI 工作区临时——编译到 lib/ 让纯逻辑测试的
          # ../lib/* import 解析（仅 node 内置依赖，零 harness）。
          # 裸 `npx tsc` 会拉到冒名包 tsc@2.0.4——必须 -p typescript@5.9。
          # npm install 必须 --legacy-peer-deps：本仓库 peer 世界有冲突
          # （dsh-brand/dsh-invariants 等），不带会 ERESOLVE 卡死 10 分钟。
          npm install --no-save --no-audit --no-fund --legacy-peer-deps @types/node@24
          npx --yes -p typescript@5.9 tsc src/credentials.ts src/concurrency.ts src/persist.ts src/types.ts src/client/panelLogic.ts \
            --outDir lib --rootDir src --module nodenext --moduleResolution nodenext \
            --target es2022 --skipLibCheck --esModuleInterop

      - name: Pure-logic TS tests
        run: |
          node --test tests/credentials.test.mjs
          node --test tests/concurrency.test.mjs
          node --test tests/build_evidence.test.mjs
          node --test tests/panel-logic.test.mjs

      - name: Test-import guard (CI-compiled modules only)
        # #13: 防止「本地 tsc 全量编译能过、CI 缺模块挂」的不一致——
        # 只检查 CI 实际运行的 4 个测试文件（其余 harness 测试是本地专用，
        # import 完整 lib/，不在此列）。
        run: |
          python - <<'EOF'
          import re, pathlib, sys
          compiled = {'credentials.js','concurrency.js','persist.js','types.js','client/panelLogic.js'}
          ci_tests = {'credentials.test.mjs','concurrency.test.mjs','build_evidence.test.mjs','panel-logic.test.mjs'}
          bad = []
          for name in ci_tests:
              t = pathlib.Path('tests') / name
              for line in t.read_text(encoding='utf-8').splitlines():
                  m = re.match(r"\s*import .* from '\.\./lib/([^']+)'", line)
                  if m and m.group(1) not in compiled:
                      bad.append(f"{name}: ../lib/{m.group(1)}")
          if bad:
              print('测试引用了 CI 未编译的模块:', *bad, sep='\n  ')
              sys.exit(1)
          print('guard OK: CI test imports are all standalone-compiled')
          EOF

  # 慢 job：bridge_fix 桥套件（需 pip 装 llm-verifier）
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # 无 cache: pip —— 仓库没有 requirements.txt/pyproject.toml 作为
          # 缓存键文件，setup-python 的 pip cache 会直接报错。

      - name: Install llm-verifier
        run: |
          python -m pip install --quiet "llm-verifier>=0.2.0"

      - name: bridge_fix offline suite
        run: python tests/test_bridge_fix.py

  # 全量 job（审查 #2）：此前 harness 依赖的 tools.ts/bestofn 测试只在本地跑。
  # DSH 宿主 peer 无法从公共 registry 完整安装，但 `pnpm add @deepseek-ai/dsh`
  # 会把全部 peer/传递依赖铺进 .pnpm 虚拟存储；提升为顶层链接后，用
  # `tsc --noCheck` 转译（测试只需要可运行的 JS，不需要类型正确）即可跑全量。
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install host runtime peers (pnpm — npm ERESOLVE-proof)
        run: |
          npm install -g pnpm@9
          # 审查 #2 排查结论：DSH 宿主 peer 里只有 3 个是 host 运行时真正需要的，
          # 且它们全部在公共 registry（dsh-tools 必须钉 0.1.1-rc.2 —— 0.0.1-rc.1
          # 依赖不存在的 @deepseek-ai/dsh-type-meta；dsh-client-runtime 依赖不存在的
          # dsh-compact，但 host 源码不用它）。cordis 无 scope 版本 4.0.0-rc.8。
          pnpm add --ignore-workspace @deepseek-ai/dsh-tools@0.1.1-rc.2 cordis@4.0.0-rc.8 schemastery 2>&1 | tail -3

      - name: Install @types/node
        run: |
          npm install --no-save --no-audit --no-fund --legacy-peer-deps @types/node@24

      - name: Transpile host with tsc --noCheck (runnable JS, not type-checked)
        run: |
          npx --yes -p typescript@5.9 tsc -p tsconfig.json --noCheck --declaration false

      - name: Full node test suite (incl. harness-dependent tests)
        run: node --test tests/*.test.mjs
