name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install toolchain
        # --legacy-peer-deps: the DSH ecosystem ships peer ranges that npm's
        # strict resolver rejects (e.g. dsh-brand needs dsh-invariants
        # ^0.0.1-rc but the resolved tree has 0.1.0-rc). The harness installs
        # these via pnpm/bundles which tolerate the overlap; CI mirrors that.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      # The host typecheck/tests import DSH peer packages (dsh-tools,
      # cordis, ...). A global dsh install provides them; build.sh links the
      # junctions from it (DSH_INSTALL layout).
      - name: Install DSH peer bundle
        run: |
          npm install -g --legacy-peer-deps @deepseek-ai/dsh
          echo "DSH_INSTALL=$(npm root -g)/@deepseek-ai/dsh" >> "$GITHUB_ENV"

      - name: Build (host + client)
        run: bash scripts/build.sh

      - name: Typecheck (host + client)
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx tsc -p tsconfig.client.json --noEmit

      - name: Unit tests (offline, no API key needed)
        run: node --test tests/*.test.mjs
