name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install toolchain
        # pnpm everywhere: DSH peer deps (dsh-scope etc.) are peerDependencies
        # that npm skips even with --legacy-peer-deps; pnpm resolves them.
        run: |
          npm install -g pnpm@9
          pnpm install --no-frozen-lockfile

      # The host typecheck/tests import DSH peer packages (dsh-tools,
      # cordis, ...). pnpm add @deepseek-ai/dsh into the project: pnpm links
      # its peers (dsh-scope, dsh-tools, ...) so build.sh's DSH_INSTALL layout
      # resolves them.
      - name: Install DSH peer bundle
        run: |
          pnpm add --no-save --ignore-workspace @deepseek-ai/dsh
          echo "DSH_INSTALL=$PWD/node_modules/@deepseek-ai/dsh" >> "$GITHUB_ENV"

      - name: Build (host + client)
        run: bash scripts/build.sh

      - name: Typecheck (host + client)
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx tsc -p tsconfig.client.json --noEmit

      - name: Unit tests (offline, no API key needed)
        run: node --test tests/*.test.mjs
