name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 蹇?job锛氱函閫昏緫楠岃瘉锛堟棤 llm-verifier / 鏃?harness 渚濊禆锛夛紝~1 鍒嗛挓鍐呭畬鎴?  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Script syntax check
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
          for f in tests/*.test.mjs; do node --check "$f"; done
          python -m py_compile bridge/verifier_brain_bridge.py bridge/bridge_fix.py

      - name: Compile harness-free TS modules standalone
        run: |
          # lib/ 涓嶅叆搴擄紝CI 宸ヤ綔鍖轰复鏃垛€斺€旂紪璇戝埌 lib/ 璁╃函閫昏緫娴嬭瘯鐨?          # ../lib/* import 瑙ｆ瀽锛堜粎 node 鍐呯疆渚濊禆锛岄浂 harness锛夈€?          # 瑁?`npx tsc` 浼氭媺鍒板啋鍚嶅寘 tsc@2.0.4鈥斺€斿繀椤?-p typescript@5.9銆?          # npm install 蹇呴』 --legacy-peer-deps锛氭湰浠撳簱 peer 涓栫晫鏈夊啿绐?          # 锛坉sh-brand/dsh-invariants 绛夛級锛屼笉甯︿細 ERESOLVE 鍗℃ 10 鍒嗛挓銆?          npm install --no-save --no-audit --no-fund --legacy-peer-deps @types/node@24
          npx --yes -p typescript@5.9 tsc src/credentials.ts src/concurrency.ts src/persist.ts src/types.ts \
            --outDir lib --module nodenext --moduleResolution nodenext \
            --target es2022 --skipLibCheck --esModuleInterop

      - name: Pure-logic TS tests
        run: |
          node --test tests/credentials.test.mjs
          node --test tests/concurrency.test.mjs
          node --test tests/build_evidence.test.mjs

  # 鎱?job锛歜ridge_fix 妗ュ浠讹紙闇€ pip 瑁?llm-verifier锛?  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # 鏃?cache: pip 鈥斺€?浠撳簱娌℃湁 requirements.txt/pyproject.toml 浣滀负
          # 缂撳瓨閿枃浠讹紝setup-python 鐨?pip cache 浼氱洿鎺ユ姤閿欍€?
      - name: Install llm-verifier
        run: |
          python -m pip install --quiet "llm-verifier>=0.2.0"

      - name: bridge_fix offline suite (51 checks)
        run: python tests/test_bridge_fix.py
