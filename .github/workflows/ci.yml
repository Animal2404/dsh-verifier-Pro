name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 诚实声明（锐评修正）：完整宿主测试（tools.ts/bestofn.ts）需要 DSH
      # harness peer bundle（cordis + 跨包类型增强），无法从公共 registry 安装
      # （dsh-scope/dsh-compact 404、增强在 monorepo 内）——这是环境限制。
      # CI 现在验证的是【真测试】而非仅语法：
      #   1. bridge_fix Python 套件 51 项离线检查（llm-verifier 在 PyPI 可装）——
      #      literal-mc 路由器、reason-first 提示、响应形态检测、模型档案
      #   2. 纯逻辑 TS 模块独立编译后测试（credentials/concurrency/persist
      #      仅依赖 node 内置，零 harness）——凭据解析、信号量/LRU 原语
      #   3. build_evidence 回归（stdlib 脚本）
      #   4. 全部脚本语法 + Python 桥语法
      - name: Python deps (llm-verifier for bridge_fix suite)
        run: |
          python -m pip install --quiet "llm-verifier>=0.2.0"

      - name: Python bridge syntax
        run: |
          python -m py_compile bridge/verifier_brain_bridge.py bridge/bridge_fix.py

      - name: Compile harness-free TS modules standalone
        run: |
          # lib/ 不入库，CI 工作区是临时的——编译到 lib/ 让纯逻辑测试的
          # ../lib/* import 解析（这些模块只依赖 node 内置，零 harness）。
          npx --yes tsc src/credentials.ts src/concurrency.ts src/persist.ts \
            --outDir lib --module nodenext --moduleResolution nodenext \
            --target es2022 --skipLibCheck --esModuleInterop

      - name: bridge_fix offline suite (51 checks, literal-mc path)
        run: python tests/test_bridge_fix.py

      - name: Pure-logic TS tests (credentials + concurrency)
        run: |
          node --test tests/credentials.test.mjs
          node --test tests/concurrency.test.mjs

      - name: build_evidence regression
        run: node --test tests/build_evidence.test.mjs

      - name: Script syntax check
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
