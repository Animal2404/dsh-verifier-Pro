name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Lightweight smoke: the full host typecheck/tests need the DSH harness
      # peer bundle (cordis + type augmentations across the monorepo), which
      # is not installable from the public registry (dsh-client-ui-slots,
      # dsh-compact etc. 404; peer augmentations live in the harness). CI
      # therefore guards what runs WITHOUT the harness:
      #   - python bridge + script syntax
      #   - the evidence-chain / build_evidence regression (spawns node
      #     scripts, only stdlib deps)
      # The harness-dependent suite (npm test locally: f1/credentials/
      # concurrency/bridge_fix) is the developer's local gate.
      - name: Python bridge syntax
        run: |
          python -m py_compile bridge/verifier_brain_bridge.py bridge/bridge_fix.py
      - name: Node script syntax
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
          for f in tests/*.test.mjs; do node --check "$f"; done
      - name: build_evidence regression (no harness needed)
        run: node --test tests/build_evidence.test.mjs
